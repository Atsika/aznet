# Kerberos configuration for the host running the tests:
#   export KRB5_CONFIG=$PWD/krb5.conf
[libdefaults]
  default_realm = CORP.TEST
  dns_lookup_kdc = false
  dns_lookup_realm = false
  rdns = false
  udp_preference_limit = 1
[realms]
  CORP.TEST = {
    kdc = localhost:88
  }
[domain_realm]
  .corp.test = CORP.TEST
